<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip to World</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="nav">
    <div class="logo">Trip to World</div>
    <nav class="menu">
      <a href="#">HOTELS ▾</a>
      <a href="#">FLIGHTS ▾</a>
      <a href="#">CAR RENTALS ▾</a>
      <a href="#">VACATION PACKAGES ▾</a>
    </nav>
    <div class="actions">
      <a href="#" class="login">Login</a>
      <button class="btn-signup">Signup</button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h1>Discover Moments That Take Your Breath Away</h1>
      <p>Hotels, flights, rentals, and more all in one seamless platform.</p>
      <button class="btn-start">Start You Journey →</button>
    </div>

    <div class="search">
      <div class="field">
        <label>City Or Hotel Name</label>
        <input type="text" placeholder="Search City Or Hotel Name">
      </div>
      <div class="field">
        <label>Check - In</label>
        <input type="text" value="Mon 21 July 2025">
      </div>
      <div class="field">
        <label>Duration</label>
        <input type="text" value="1 Day">
      </div>
      <div class="field">
        <label>Guests</label>
        <input type="text" value="3 Adults">
      </div>
      <button class="btn-search">Search Hotel</button>
    </div>
  </section>

</body>

</html>
